[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinoform"
version = "1.0.0"
description = "Sparse-control nasal morphology deformation on registered FaceScape meshes (RB-SR)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [{name = "Zequan Li"}]
license = "BSD-3-Clause"
keywords = ["3D morphable models", "shape deformation", "geometric deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Cecilialzq/Rhinoform"
Repository = "https://github.com/Cecilialzq/Rhinoform"
Documentation = "https://github.com/Cecilialzq/Rhinoform#readme"

[project.scripts]
rhinoform-reproduce = "tools.reproduce:main"

[tool.setuptools]
packages = ["rhinoform", "rhinoform.novelty_upgrade",
            "scripts", "scripts.data_processing", "scripts.training",
            "scripts.evaluation", "scripts.analysis",
            "scripts.analysis.negative_controls", "scripts.analysis.flip_validation",
            "scripts.pipeline", "tools"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
